plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.armandino.italiatv'
    compileSdk 35

    defaultConfig {
        applicationId "nl.armandino.italiatv"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
