plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.armandino.italiatv'
    compileSdk 35

    defaultConfig {
        applicationId "nl.armandino.italiatv"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Stable GeckoView release compatible with the Android 35 build toolchain.
    // Use the 32-bit ARM build for the STRONG LEAP-S3+V2 class of Google TV boxes.
    implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:137.0.20250414091429"
}
