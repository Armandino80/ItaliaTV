plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.armandino.italiatv'
    compileSdk 37

    defaultConfig {
        applicationId "nl.armandino.italiatv"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Target the 32-bit ARM userspace commonly used by S905Y4 Google TV boxes.
    // Keeping the ABI-specific GeckoView avoids shipping an unnecessarily huge universal browser engine.
    implementation "org.mozilla.geckoview:geckoview-armeabi-v7a:155.0.20260903215306"
}
